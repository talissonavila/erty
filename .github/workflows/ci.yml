name: CI

on:
  pull_request:
    branches:
      - development
      - main

  push:
    branches:
      - development
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
    
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: erty
      POSTGRES_USER: erty_user
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: erty
          POSTGRES_USER: erty_user
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erty_user -d erty"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Check formatting
        run: poetry run task format-check

      - name: Lint
        run: poetry run task lint-check

      - name: Type check
        run: poetry run task typecheck

      - name: Run tests
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: poetry run task test-coverage
