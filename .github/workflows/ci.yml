name: CI

on:
  pull_request:
    branches:
      - development
      - main

  push:
    branches:
      - development
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Check formatting
        run: poetry run task format-check

      - name: Lint
        run: poetry run task lint-check

      - name: Type check
        run: poetry run task typecheck

      - name: Run tests
        run: poetry run task test-coverage
