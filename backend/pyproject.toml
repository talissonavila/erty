[project]
name = "erty-backend"
version = "0.1.0"
description = "Backend API for the ERTY URL shortener"
authors = [
    {name = "Talisson Avila"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "psycopg (>=3.3.4,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = """
-ra
--cov=app
--cov-report=term-missing
--cov-report=html
"""

[tool.taskipy.tasks]
test = "python -m pytest -s -x -vvv"
test-coverage = "python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85"
test_api = "python -m pytest tests/api -s -x -vvv"
test_unit = "python -m pytest tests/unit -s -x -vvv"
test_integration = "python -m pytest tests/integration -s -x -vvv"

lint = "ruff check . --fix"
lint-check = "ruff check ."

format = "ruff format ."
format-check = "ruff format --check ."

typecheck = "mypy app"

check = "task format && task lint && task typecheck && task test"

precommit = "pre-commit run --all-files"

[dependency-groups]
dev = [
    "ruff (>=0.16.4,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "httpx2 (>=2.12.0,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]
